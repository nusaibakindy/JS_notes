<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>basic java task1</title>
</head>
<body>
    <h1>Write a number to Check if the number is Even or Odd</h1>
    <input type="number" id="numberInput" placeholder="Enter a number">
    <button onclick="checkEvenOrOdd()">Check</button>
    <div id="result"></div>

    <script>
        function checkEvenOrOdd() {
            const number = document.getElementById("numberInput").value;
      
            if (number % 2 === 0) {
                document.getElementById("result").innerText = `${number} is Even.`;
            } else {
                document.getElementById("result").innerText = `${number} is Odd.`;
            }
        }
    </script>
</body>
</html>
